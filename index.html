<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>🛒 쇼핑 리스트</h1>

    <form id="add-form" class="add-form">
      <input
        id="item-input"
        type="text"
        placeholder="살 물건을 입력하세요"
        autocomplete="off"
        maxlength="100"
      >
      <button type="submit">추가</button>
    </form>

    <p id="empty-message" class="empty-message">아직 담긴 항목이 없어요.</p>
    <ul id="item-list" class="item-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
